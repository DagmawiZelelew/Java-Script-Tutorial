<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — DZ Tech Solutions</title>
<style>
  :root{
    --ink:#1C2B3A;
    --paper:#FAF8F4;
    --accent:#C77B3E;
    --muted:#6B7684;
    --line:#E4DFD5;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    font-family:Arial, Helvetica, sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  a{ color:inherit; text-decoration:none; }

  header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:24px 8%;
    border-bottom:1px solid var(--line);
  }
  .brand{ font-size:20px; font-weight:700; }
  header a.home-link{
    font-size:14px;
    border:1px solid var(--ink);
    padding:8px 16px;
    border-radius:6px;
    transition:background 0.2s ease, color 0.2s ease;
  }
  header a.home-link:hover{ background:var(--ink); color:var(--paper); }

  main{
    flex:1;
    max-width:600px;
    margin:0 auto;
    padding:70px 8%;
    text-align:center;
  }
  main h1{
    font-size:clamp(26px, 4vw, 34px);
    margin-bottom:12px;
  }
  main > p{
    color:var(--muted);
    margin-bottom:40px;
  }

  .contact-list{
    display:flex;
    flex-direction:column;
    gap:14px;
    text-align:left;
  }
  .contact-item{
    background:white;
    border:1px solid var(--line);
    border-radius:8px;
    padding:18px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    transition:transform 0.2s ease, box-shadow 0.2s ease;
  }
  .contact-item:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 16px rgba(0,0,0,0.08);
  }
  .contact-item .label{
    font-size:12px;
    text-transform:uppercase;
    color:var(--muted);
    letter-spacing:0.5px;
  }
  .contact-item .value{
    font-size:16px;
    font-weight:bold;
  }
  .contact-item a.action{
    font-size:13px;
    color:var(--accent);
    font-weight:bold;
    transition:opacity 0.2s ease;
  }
  .contact-item a.action:hover{ opacity:0.7; }

  footer{
    text-align:center;
    padding:24px;
    color:var(--muted);
    font-size:13px;
    border-top:1px solid var(--line);
  }
</style>
</head>
<body>

  <header>
    <a href="page.html" class="brand">DZ Tech Solutions</a>
    <a href="page.html" class="home-link">Home</a>
  </header>

  <main>
    <h1>Contact Us</h1>
    <p>Reach out through email, Telegram, or phone — we usually reply within a few hours.</p>

    <div class="contact-list">
      <div class="contact-item">
        <div>
          <div class="label">Email</div>
          <div class="value">dagipeacu@gmail.com</div>
        </div>
        <a class="action" href="mailto:dagipeacu@gmail.com">Send</a>
      </div>
      <div class="contact-item">
        <div>
          <div class="label">Telegram</div>
          <div class="value">@dzdagi</div>
        </div>
        <a class="action" href="https://t.me/dzdagi" target="_blank" rel="noopener">Open</a>
      </div>
      <div class="contact-item">
        <div>
          <div class="label">Phone</div>
          <div class="value">+251 981 793 089</div>
        </div>
        <a class="action" href="tel:+251981793089">Call</a>
      </div>
    </div>
  </main>

  <footer>
    © 2026 DZ Tech Solutions. All rights reserved. · Privacy Policy
  </footer>

</body>
</html>
