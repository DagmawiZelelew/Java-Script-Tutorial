<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel = "stylesheet" href = "RPC.css">
</head>
<body>
<h1 id = "welcome">Welcome to the Rock Paper Scissor Game</h1>
<h2 id ="howtoplay" >How to play the Game:</h2>
<h3 id = "choose">Choose Rock, Paper, or Scissors to play against the computer. The first player to reach 5 points wins!</h3><br><br>
<label id = "enter">Enter your response(R,P,C):</label>
<button id = "rock">🪨 Rock</button>
<button id = "paper">📄 Paper</button>
<button id = "scissor">✂️ Scissors</button>
<h1 id = "result"></h1>
<button id = "end">End</button> <br><br>
<button id="restart">🔄 Restart Game</button><br><br>
<table id = "table" border="1">
    <tr>
        <th>Wons</th>
        <th>Draws</th>
        <th>Losts</th>
    </tr>

    <tr>
        <td id ="won" ></td>
        <td id = "draw"></td>
        <td id = "lost" ></td>
    </tr>
</table>

<script src="RPC.js"></script>


</body>
</html>
