<!DOCTYPE html>
<html>
<head>
  <style>
    .news {
      color: rgb(255, 174, 0);
      font-size: 20px;
      font-family: Arial, sans-serif;
      text-align: center;
      margin-bottom: 10px;
    }

    .newss {
      font-size: 40px;
      font-family: Arial, sans-serif;
      text-align: center;
      font-weight: 600;
      margin: 0;
    }

    .pros {
      font-size: 60px;
      font-family: Arial, sans-serif;
      text-align: center;
      font-weight: 600;
      margin-top: 10px;
      margin-bottom: 10px;
    }

    .doll {
      font-size: 20px;
      font-family: Arial, sans-serif;
      text-align: center;
      color: rgb(158, 154, 146);
      margin-top: 0;
      margin-bottom: 20px;
    }

    .buy {
      background-color: rgb(7, 57, 167);
      color: white;
      font-weight: 400;
      font-size: 20px;
      font-family: Arial, sans-serif;
      border-radius: 40px;
      padding: 15px 25px;
      border: none;
      cursor: pointer;
    }

    .divine {
      text-align: center;
    }
		.buy:hover {
			background-color: rgb(0, 0, 65);
			transform: scale(1.1);
			transition: 0.2s ;
		}
		.buy:active {
			opacity: 0.5;
			transition: 0.2s ;
		}
  </style>
</head>

<body>

  <p class="news">New</p>

  <p class="newss">MacBook Pro</p>

  <p class="pros">Supercharged for pros</p>

  <p class="doll">From $1,999</p>

  <div class="divine">
    <button class="buy">Buy Now </button>
  </div>

</body>
</html>
